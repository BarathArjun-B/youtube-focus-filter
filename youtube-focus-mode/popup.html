<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Focus Mode</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: rgba(255, 255, 255, 0.08);
        --panel-strong: rgba(255, 255, 255, 0.12);
        --border: rgba(255, 255, 255, 0.15);
        --text: #f7fafc;
        --muted: #a7b0c0;
        --accent: #5eead4;
        --warn: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 340px;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(94, 234, 212, 0.18), transparent 35%),
          linear-gradient(145deg, #0b0f14, #131821);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        padding: 16px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.28);
      }

      .mark img {
        width: 28px;
        height: 28px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(12, 16, 22, 0.74);
        backdrop-filter: blur(18px);
        box-shadow: 0 16px 60px rgba(0, 0, 0, 0.28);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 13px;
      }

      .row + .row {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .label {
        display: block;
        font-size: 13px;
        font-weight: 800;
      }

      .hint {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .switch {
        position: relative;
        flex: 0 0 auto;
        width: 48px;
        height: 28px;
      }

      .switch input {
        position: absolute;
        opacity: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        cursor: pointer;
        transition: background 160ms ease, border-color 160ms ease;
      }

      .slider::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        transition: transform 160ms ease;
      }

      input:checked + .slider {
        border-color: rgba(94, 234, 212, 0.5);
        background: rgba(94, 234, 212, 0.38);
      }

      input:checked + .slider::after {
        transform: translateX(20px);
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .stat {
        min-height: 78px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        background: var(--panel);
      }

      .stat strong {
        display: block;
        font-size: 22px;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }

      .stat span {
        display: block;
        margin-top: 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .streak {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .streak strong {
        color: var(--warn);
      }

      footer {
        margin-top: 12px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="mark"><img src="assets/icon.png" alt=""></div>
        <div>
          <h1>YouTube Focus Mode</h1>
          <p class="subtitle">Study-first YouTube controls</p>
        </div>
      </header>

      <section class="panel" aria-label="Focus settings">
        <label class="row">
          <span>
            <span class="label">Enable Focus Mode</span>
            <span class="hint">Hide feeds, comments, Shorts, and suggestions.</span>
          </span>
          <span class="switch">
            <input id="focus-toggle" type="checkbox">
            <span class="slider"></span>
          </span>
        </label>

        <label class="row">
          <span>
            <span class="label">Strict Mode</span>
            <span class="hint">Only direct video URLs stay accessible.</span>
          </span>
          <span class="switch">
            <input id="strict-toggle" type="checkbox">
            <span class="slider"></span>
          </span>
        </label>
      </section>

      <section class="stats" aria-label="Daily productivity stats">
        <div class="stat">
          <strong id="watch-time">0m</strong>
          <span>Watch time today</span>
        </div>
        <div class="stat">
          <strong id="videos-watched">0</strong>
          <span>Videos watched</span>
        </div>
        <div class="stat streak">
          <span>Productivity streak</span>
          <strong id="streak">0 days</strong>
        </div>
      </section>

      <footer id="status">Ready when you are.</footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
